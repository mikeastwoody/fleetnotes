# fleetnotes — privacy rules for the fleet feed. Copy to the config's
# rules_file (~/.config/fleetnotes/rules.conf) and `chmod 600` it, or let
# `fleetnotes fleet allow` create it for you. Keep it private: it names your
# projects and task ids.
#
# Without "project" lines nothing of the fleet is published. Every line must
# parse exactly; while any line has an error, nothing of the fleet is
# published and captain's notes are refused. Comments go on lines of their own.
#
#   project <project folder> "<public name>"   (up to 16 characters)
#   label   <task id>        "<what it does>"  (up to 60 characters; without a
#                                               label the cleaned title is used)
#   block   <regular expression>               (blocked words, any case)

project   lighthouse        "Lighthouse"
project   driftwood         "Driftwood"
label     lh-ticker-notes   "notes that update themselves"
block     secretproject|client-name
